name: Privacy & Secrets Gate

# The local pre-commit hook only protects the maintainer's machine.
# This gate enforces the same boundary for every push and contributor PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy Blocklist Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Full-tree privacy scan
        # Name patterns come from repo secrets so the public blocklist file
        # never has to publish them. Unset secrets resolve to empty and the
        # scan reports that only the committed blocklist is enforced.
        env:
          PRIVACY_EMAIL_PATTERN: ${{ secrets.PRIVACY_EMAIL_PATTERN }}
          PRIVACY_PHONE_PATTERN: ${{ secrets.PRIVACY_PHONE_PATTERN }}
          PRIVACY_EXTRA_PATTERNS: ${{ secrets.PRIVACY_EXTRA_PATTERNS }}
        run: python3 .github/scripts/privacy_scan.py --all

  secrets:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
