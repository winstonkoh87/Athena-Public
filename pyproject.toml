[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athena-agent"
version = "9.9.8"
description = "Athena — a local-first agentic PKM that helps you make better decisions with your own context. Persistent memory, structured reasoning, and governed AI agents that work across any LLM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Winston Koh" }
]
keywords = [
    "ai-agent", "llm", "cognitive-os", "memory-bank",
    "model-agnostic", "ai-framework", "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "python-dotenv>=1.2.2",
    "google-genai>=2.14.0",
    "supabase>=2.31.0",
    "requests>=2.34.2",
    "pydantic>=2.13.4",
    "anthropic>=0.120.0",

    "flashrank>=0.2.10",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "diskcache>=5.6.3",
    "fastmcp>=3.4.4"
]

[project.scripts]
athena = "athena.__main__:main"

[project.urls]
Homepage = "https://winstonkoh87.com/athena/"
Repository = "https://github.com/winstonkoh87/Athena-Public"
Documentation = "https://github.com/winstonkoh87/Athena-Public#readme"
Changelog = "https://github.com/winstonkoh87/Athena-Public/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "pipreqs",
    "pydeps"
]
mcp = [
    "fastmcp>=3.4.4"
]

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
# Real-bug rules (all of F: unused/undefined/redefined, plus I, C4, UP, most E/W/B/SIM)
# stay fully enforced. The codes below are intentional, consistent patterns in this
# solo codebase, not defects:
#   E402 — lazy/conditional imports (CLI startup speed; env-before-import in reranker)
#   E701 — one-liner guard clauses (`if x: return`)
#   E722 — defensive best-effort `except:` in non-critical paths
#   B007 — intentionally unused loop vars
#   SIM105/108 — style preference (explicit try/except and if/else over sugar)
ignore = ["E501", "B008", "E402", "E701", "E722", "B007", "SIM105", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["athena"]

[tool.black]
line-length = 88
target-version = ["py310"]
